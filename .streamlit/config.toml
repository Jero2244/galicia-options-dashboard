# Adapted from Streamlit's bundled financial-dashboard theme.
[server]
address = "127.0.0.1"
headless = true

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#60A5FA"
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#F1F5F9"
borderColor = "#334155"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "6px"
font = "sans serif"
chartCategoricalColors = ["#60A5FA", "#FBBF24", "#34D399", "#A78BFA"]
